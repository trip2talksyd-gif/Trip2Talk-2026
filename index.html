    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Trip2Talk" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#16262b" />
    <title>Trip2Talk — Photo Trips in Australia</title>
    <meta
      name="description"
      content="Small-group photo trips around Australia — max 6 people, a pro photographer on every trip. Uluru, Tasmania, New Zealand, Sydney and more."
    />
    <link rel="canonical" href="https://trip2talk.com.au/" />

    <!-- Open Graph — controls how links look when shared on Facebook/Messenger, our main channel -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Trip2Talk" />
    <meta property="og:title" content="Trip2Talk — Photo Trips in Australia" />
    <meta
      property="og:description"
      content="Small-group photo trips around Australia — max 6 people, a pro photographer on every trip. Uluru, Tasmania, New Zealand, Sydney and more."
    />
    <meta property="og:image" content="https://www.trip2talk.com.au/brand/trip2talk-og.jpg" />
    <meta property="og:url" content="https://trip2talk.com.au/" />
    <meta property="og:locale" content="en_AU" />

    <!-- Twitter/X card (also used by some link-preview bots) -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Trip2Talk — Photo Trips in Australia" />
    <meta
      name="twitter:description"
      content="Small-group photo trips around Australia — max 6 people, a pro photographer on every trip."
    />
    <meta name="twitter:image" content="https://www.trip2talk.com.au/brand/trip2talk-og.jpg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Geist:wght@300;400;500;600;700&family=Silkscreen:wght@400;700&family=Noto+Serif+Thai:wght@500;600;700&family=Prompt:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&family=Sarabun:wght@400;500;600;700&family=Caveat:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // One-shot force-clear for ALL previously installed PWAs (not only white-screen).
      // Marks localStorage first so the post-clear reload cannot loop.
      (function () {
        var KEY = 't2t_sw_force_clear_v3'
        if (!('serviceWorker' in navigator)) return
        try {
          if (localStorage.getItem(KEY) === '1') return
          localStorage.setItem(KEY, '1')
        } catch (e) {
          return
        }
        Promise.all([
          navigator.serviceWorker.getRegistrations().then(function (regs) {
            return Promise.all(regs.map(function (r) { return r.unregister() }))
          }),
          caches.keys().then(function (keys) {
            return Promise.all(keys.map(function (k) { return caches.delete(k) }))
          }),
        ]).then(function () {
          location.reload()
        }).catch(function () {
          location.reload()
        })
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
